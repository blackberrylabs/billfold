[source]
kind = "documentation"
url = "https://platform.claude.com/docs/en/manage-claude/authentication"
read_on = 2026-10-17
quote = "set the `ANTHROPIC_API_KEY` environment variable and the client SDKs pick it up automatically"
note = "Claude Code env vars: code.claude.com/docs/en/authentication.md — ANTHROPIC_API_KEY (X-Api-Key), ANTHROPIC_AUTH_TOKEN (Bearer), CLAUDE_CODE_OAUTH_TOKEN"

[[shapes]]
regex = "^sk-ant-(?:api03|admin01)-[A-Za-z0-9_-]{93}AA$"
[shapes.source]
kind = "observed"
url = "https://github.com/gitleaks/gitleaks/blob/master/cmd/generate/config/rules/anthropic.go"
read_on = 2026-10-17
quote = "sk-ant-api03-[a-zA-Z0-9_\\-]{93}AA"
note = "b58d3f1 L14, L45 (admin01); trufflehog anthropic.go:28 same; Anthropic documents only `sk-ant-api...` and the hint `sk-ant-api03-R2D...igAA`"

[[shapes]]
regex = "^sk-ant-oat01-[A-Za-z0-9_-]{20,}$"
[shapes.source]
kind = "observed"
url = "https://code.claude.com/docs/en/authentication"
read_on = 2026-10-17
quote = "A long-lived OAuth token generated by `claude setup-token`"
note = "the `sk-ant-oat01-` prefix itself is NOT DOCUMENTED anywhere read; kept as a loose shape"

