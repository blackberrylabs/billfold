env_vars = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN"]
config_names = ["anthropic-api-key", "anthropicApiKey", "anthropic_api_key", "claude-api-key", "claudeApiKey"]
