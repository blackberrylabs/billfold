id = "google"
name = "Google (Gemini, Vertex)"
env_vars = ["GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT"]
config_names = ["gemini-api-key", "geminiApiKey", "gemini_api_key", "google-api-key", "googleApiKey"]
usage_url = "https://aistudio.google.com/usage"
index_ids = ["google"]
id_prefixes = ["models/", "google/"]
aliases = [["gemini-2.5-pro-preview-06-05", "gemini-2.5-pro"]]

[source]
kind = "documentation"
url = "https://ai.google.dev/gemini-api/docs/api-key"
read_on = 2026-10-17
quote = "Set the environment variable `GEMINI_API_KEY` or `GOOGLE_API_KEY`."
note = "\"If both are set, `GOOGLE_API_KEY` takes precedence.\"; ADC: `GOOGLE_APPLICATION_CREDENTIALS` (docs.cloud.google.com application-default-credentials)"

[[shapes]]
regex = "^AIza[A-Za-z0-9_-]{35}$"
[shapes.source]
kind = "observed"
url = "https://github.com/gitleaks/gitleaks/blob/master/cmd/generate/config/rules/gcp.go"
read_on = 2026-10-17
quote = "AIza[\\w-]{35}"
note = "b58d3f1 L32; `AIza` is the generic Google API key prefix, not Gemini-specific"

[pricing]
