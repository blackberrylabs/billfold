[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alexandre Do"]
repository = "https://github.com/blackberrylabs/billfold"

[workspace.dependencies]
# The Blackberrylabs foundations, by tag.
bbl-hostrules = { git = "https://github.com/blackberrylabs/bbl-hostrules", tag = "v0.5.0" }
bbl-report = { git = "https://github.com/blackberrylabs/bbl-report", tag = "v0.1.0" }
bbl-ui = { git = "https://github.com/blackberrylabs/bbl-ui", tag = "v0.1.0" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
regex = "1"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Read-only drivers for what the hosts write: SQLite (OpenCode, Goose, Kilo, Zed, Cursor),
# zstd (Codex rollouts after 7 days, Zed threads).
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
# The session fingerprint of a key: HMAC with a salt that lives in memory only.
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# gitignore matching without running git.
ignore = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
